<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f58220">
  <title>FINDAT Cloud</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-label="Starting FINDAT Cloud">
    <div class="boot-mark" aria-hidden="true"><span></span></div>
    <div class="boot-title">FINDAT Cloud</div>
    <div class="boot-progress"><span></span></div>
  </div>

  <main id="desktop" class="desktop" aria-label="FINDAT Cloud desktop">
    <div class="wallpaper" aria-hidden="true">
      <span class="wallpaper-ray ray-one"></span>
      <span class="wallpaper-ray ray-two"></span>
      <span class="wallpaper-ray ray-three"></span>
      <span class="wallpaper-glow"></span>
    </div>

    <header class="menu-bar" aria-label="Menu bar">
      <div class="menu-left">
        <button class="menu-item system-menu" id="systemMenuBtn" aria-label="FINDAT Cloud menu">
          <span class="aurelia-symbol" aria-hidden="true"></span>
          <span class="system-menu-label">Cloud</span>
        </button>
        <nav id="workstationTabs" class="workstation-tabs" aria-label="Work stations"></nav>
        <button id="addWorkstationBtn" class="workstation-add" type="button" title="Add work station" aria-label="Add work station">+</button>
        <button id="fullscreenToggleBtn" class="workstation-fullscreen" type="button" title="Enter full screen" aria-label="Enter full screen" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="4.5" width="17" height="12" rx="2"></rect>
            <path d="M9 20h6M12 16.5V20"></path>
          </svg>
        </button>
      </div>
      <div class="menu-right">
        <button class="status-item status-control" id="controlCenterBtn" title="Control Center" aria-label="Control Center"><i></i><i></i></button>
        <button class="status-item clock" id="clockBtn" type="button" aria-label="Open date and time" aria-expanded="false" aria-controls="dateTimePanel"><span id="menuClock"></span></button>
      </div>
    </header>

    <section id="desktopIcons" class="desktop-icons" aria-label="Desktop files">
      <button class="desktop-icon system-desktop-icon" data-desktop-key="system:drive" data-app="finder" data-path="/">
        <span class="desktop-app-icon" data-icon="drive"></span>
        <small>FINDAT Cloud</small>
      </button>
      <button class="desktop-icon system-desktop-icon" data-desktop-key="system:applications" data-app="launchpad">
        <span class="desktop-app-icon" data-icon="launchpad"></span>
        <small>Applications</small>
      </button>
      <button class="desktop-icon system-desktop-icon" data-desktop-key="system:trash" data-app="trash" data-path="/Trash">
        <span class="desktop-app-icon" data-icon="trash"></span>
        <small>Trash</small>
      </button>
      <div id="desktopFileIcons" class="desktop-file-icons"></div>
    </section>

    <section id="windows" class="windows" aria-live="polite"></section>

    <aside id="systemPanel" class="popover system-panel hidden" aria-label="FINDAT Cloud menu">
      <h3>FINDAT Cloud</h3>
      <button data-action="settings">System Settings…</button>
      <button data-action="applications">Applications…</button>
      <hr>
      <button data-action="lock">Lock Screen</button>
      <button data-action="restart">Restart…</button>
      <button data-action="exit-cloud">Exit Cloud</button>
    </aside>




    <div id="contextMenu" class="context-menu hidden" role="menu" aria-label="File actions"></div>

    <div id="dropOverlay" class="drop-overlay hidden" aria-hidden="true">
      <div><span>⇩</span><b>Drop files to upload</b><small>They will be saved to FINDAT Cloud</small></div>
    </div>

    <input id="fileUploadInput" type="file" multiple hidden>
    <input id="folderUploadInput" type="file" multiple webkitdirectory directory hidden>
    <input id="driveImageInput" type="file" accept=".json,.findat.json,.aurelia.json,application/json" hidden>
    <input id="wallpaperInput" type="file" accept="image/*" hidden>

    <aside id="controlCenter" class="control-center hidden" aria-label="Control Center">
      <div class="control-grid">
        <button class="control-tile" id="focusToggle">
          <span class="tile-icon">◐</span><span><b>Focus</b><small>Off</small></span>
        </button>
        <button class="control-tile" id="darkToggle">
          <span class="tile-icon">◒</span><span><b>Dark Mode</b><small>Off</small></span>
        </button>
      </div>
      <label class="slider-card"><span>Display</span><input id="brightness" type="range" min="55" max="115" value="100"></label>
      <label class="slider-card"><span>Sound</span><input id="soundSlider" type="range" min="0" max="100" value="46"></label>
    </aside>



    <aside id="dateTimePanel" class="date-time-panel hidden" aria-label="Date and time" aria-hidden="true">
      <section class="date-time-status-card">
        <div class="date-time-status-copy">
          <small id="dateTimeWeekday">Today</small>
          <strong id="dateTimeLargeDate">--</strong>
          <span id="dateTimeFullDate">Loading date…</span>
        </div>
        <div class="date-time-status-side">
          <span class="date-time-status-icon" aria-hidden="true">☁</span>
          <b>FINDAT Cloud</b>
          <small>System ready</small>
        </div>
      </section>
      <div class="date-time-widget-grid">
        <section class="analog-clock-widget" aria-label="Local clock">
          <div class="analog-clock-face" aria-hidden="true">
            <span class="clock-number n12">12</span><span class="clock-number n1">1</span><span class="clock-number n2">2</span>
            <span class="clock-number n3">3</span><span class="clock-number n4">4</span><span class="clock-number n5">5</span>
            <span class="clock-number n6">6</span><span class="clock-number n7">7</span><span class="clock-number n8">8</span>
            <span class="clock-number n9">9</span><span class="clock-number n10">10</span><span class="clock-number n11">11</span>
            <i id="analogHourHand" class="analog-hand hour-hand"></i>
            <i id="analogMinuteHand" class="analog-hand minute-hand"></i>
            <i id="analogSecondHand" class="analog-hand second-hand"></i>
            <i class="analog-clock-pin"></i>
          </div>
          <strong>Local Time</strong>
          <small id="analogClockDigital">--:--</small>
        </section>
        <section class="calendar-widget" aria-label="Monthly calendar">
          <header class="calendar-widget-header">
            <span id="calendarMonthName">Month</span>
            <strong id="calendarYear">----</strong>
          </header>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div id="calendarDays" class="calendar-days"></div>
        </section>
      </div>
    </aside>

    <section id="lockScreen" class="lock-screen hidden" aria-label="Lock screen">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
      <button id="unlockBtn">Click to unlock</button>
    </section>

    <div id="toast" class="toast hidden" role="status"></div>
  </main>

  <template id="windowTemplate">
    <article class="app-window" role="dialog">
      <header class="window-titlebar">
        <div class="traffic-lights">
          <button class="close" type="button" data-window-action="close" aria-label="Close" title="Close"></button>
          <button class="minimize" type="button" data-window-action="minimize" aria-label="Minimize" title="Minimize"></button>
          <button class="maximize" type="button" data-window-action="maximize" aria-label="Maximize" title="Maximize"></button>
        </div>
        <div class="window-title"></div>
        <div class="title-spacer"></div>
      </header>
      <div class="window-body"></div>
      <div class="resize-handle" aria-hidden="true"></div>
    </article>
  </template>

  <script type="module" src="shared-storage-bootstrap.mjs"></script>
</body>
</html>
