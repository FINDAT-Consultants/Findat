project_id = "findat-consultants"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

# These functions perform their own authentication checks because the deployed
# frontend uses a browser-safe publishable key. Do not expose service-role or
# secret keys in the browser.
[functions.findat-username-login]
verify_jwt = false

[functions.findat-admin-users]
verify_jwt = true

[functions.findat-bootstrap-admin]
verify_jwt = false

[functions.findat-x1-openai]
# Public x1 chat: the function performs optional user-token validation and its
# own anonymous quota/security checks.
verify_jwt = false
